<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>社區管理費用・富來大郡社區</title>
<link rel="icon" href="assets/favicon.ico" sizes="any">
<link rel="stylesheet" href="assets/site.css">
<style>
  .fee-table { width: 100%; border-collapse: collapse; }
  .fee-table th, .fee-table td {
    border: 1px solid var(--line-soft); padding: .6rem .8rem; text-align: left; font-size: .87rem;
  }
  .fee-table thead th { background: var(--header-bg); color: var(--header-ink); font-weight: 600; }
  .fee-table td.amount { font-family: var(--font-mono); color: var(--accent); font-weight: 600; }
</style>
</head>
<body data-page="rules-fees">
<header class="site-header" id="site-header"></header>
<!-- 2026-08-26：header 內容改成從 assets/site-info.json 動態注入，見 assets/nav.js。
     8 個頁面原本各自寫死一份完全相同的 header（社區名稱、導覽連結），改一個連結要記得
     同步改 8 個檔案，現在單一事實來源改成那份 JSON -->

<div class="page">
  <header class="masthead">
    <p class="eyebrow">費用資訊</p>
    <h1>社區管理費用</h1>
    <p class="lede">管理費收費標準與繳費方式，讓住戶清楚了解社區費用相關規定。</p>
  </header>

  <section class="section">
    <h2>管理費收費標準</h2>
    <div style="overflow-x:auto;">
      <table class="fee-table">
        <thead><tr><th>類別</th><th>計費方式</th><th>費率</th></tr></thead>
        <tbody>
          <tr><td>住宅／店面（統一費率）</td><td>每坪／每月</td><td class="amount">NT$ 80 / 坪</td></tr>
          <tr><td>汽車清潔費</td><td>每車位／每月</td><td class="amount">NT$ 300 / 位</td></tr>
          <tr><td>機車清潔費</td><td>每車位／每月</td><td class="amount">NT$ 100 / 位</td></tr>
        </tbody>
      </table>
    </div>
  </section>

  <section class="section">
    <h2>繳費方式</h2>
    <ul style="margin:0;padding-left:1.2rem;display:flex;flex-direction:column;gap:.4rem;">
      <li style="font-size:.87rem;color:var(--ink-soft);line-height:1.6;"><strong style="color:var(--ink);">銀行轉帳</strong>：轉入管委會指定帳戶，轉帳後請提供末五碼供對帳。</li>
      <li style="font-size:.87rem;color:var(--ink-soft);line-height:1.6;"><strong style="color:var(--ink);">超商代收</strong>：憑管理費繳費單至各大超商繳納。</li>
      <li style="font-size:.87rem;color:var(--ink-soft);line-height:1.6;"><strong style="color:var(--ink);">信用卡</strong>：可透過信用卡繳納管理費，詳細作業方式請洽管理室。</li>
    </ul>
  </section>
</div>

<footer class="site-footer" id="site-footer"></footer>
<!-- 2026-08-26：footer 內容（地址、電話、辦公時間）改成從 assets/site-info.json 動態
     注入，見 assets/nav.js，理由同上面 header 的說明 -->
<script src="assets/nav.js"></script>
</body>
</html>
