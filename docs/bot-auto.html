<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>富來大郡AI</title>
<link rel="icon" href="assets/favicon.ico" sizes="any">
<!--
  2026-08-16 從 bot-form.html 拆出來的專用頁——原本圖文選單開「!選單」是共用 bot-form.html
  帶 auto=1 這個模式，但那頁的 DOM 一開始就有完整的 textarea/送出按鈕（只是 disabled），
  要等 liff.init() 這個非同步流程跑完、確認是 autoMode 之後才用 JS 把它們藏起來，中間這段
  空檔使用者會看到一閃而過的輸入表單，容易誤以為「要打字」。

  這頁從一開始就沒有任何表單元素，只有一句狀態文字，不會有「先看到表單、才變成選單」這種
  畫面閃爍——單純負責「打開就悄悄送出 cmd、送完關閉視窗」這一件事，不像 bot-form.html
  還要處理使用者輸入。

  跟 bot-form.html 一樣共用同一套 query string 規則（實際會被包進 liff.state，見
  resolveQueryParams 的說明），但只吃 cmd／groupId 這兩個參數，不需要 title/placeholder/
  hint/content——這頁從來不會顯示表單，這些欄位用不到。

  2026-08-26 新增 url 這個第三個模式，跟 cmd 互斥（呼叫端只會帶其中一個）：帶 url 時完全
  跳過「登入 → 打 /api/liff-command」那條路，改成單純呼叫 liff.openWindow(url, external:
  true) 強制跳出去用系統瀏覽器（Safari／Chrome）——起因是 community-line-bot 的
  externalLinkButton（清潔班表／開通教學這兩顆按鈕）發現 LINE 內建瀏覽器不支援
  window.print()，社區官網規約頁面的「列印／另存 PDF」按鈕點了沒反應，借用這支既有的
  LIFF app 解決，沒有另外申請新的 app。詳見下面 script 裡 externalUrl 那段的說明。

  重要：LIFF 的「Endpoint URL」是跟 LIFF ID 綁死的一對一關係，沒辦法讓同一個 LIFF ID
  同時指向 bot-form.html 又指向這一頁。bot-form.html 繼續用原本既有的那組 LIFF ID
  （結尾 8KD6wVsP，儀表板所有打字表單按鈕共用的那組，不要動）；要讓圖文選單真的連到這頁，
  需要在 LINE Developers Console 這個 Messaging API channel 底下「另外新增一個 LIFF
  app」，Endpoint URL 填：
    https://fulaidajuncommunity-dev.github.io/FulaiDajun/bot-auto.html
  拿到新的 LIFF ID 之後貼到下面 LIFF_ID 這個常數，圖文選單的連結動作也要改指到
  `https://liff.line.me/{新的LIFF_ID}?cmd=...`（不用再帶 &auto=1，這頁本身就是純自動送出）。

  2026-08-16 指令改名：cmd 帶的內部指令字串原本是 `!幫助`，後端已經收斂成只認 `!選單`
  這一種寫法（見 community-line-bot/src/index.js 的 tryCommandShortcut）。這個 cmd 值是
  設定在 LINE Official Account Manager／Developers Console 的圖文選單「動作」網址參數裡，
  不是這份程式碼能控制的——記得手動把圖文選單連結改成
  `https://liff.line.me/{LIFF_ID}?cmd=!%E9%81%B8%E5%96%AE`（即 URL-encode 過的 `!選單`，
  `encodeURIComponent('!選單')` 算出來的結果——`!` 本身不會被跳脫），不然圖文選單那顆按鈕
  會送出後端已經不認得的舊指令字串。
-->
<style>
  :root {
    --paper: #faf3e9;
    --ink: #4a3726;
    --ink-soft: #92795f;
    --accent: #e8794f;
    --warn-bg: #fdecda;
    --warn-ink: #ad5b1c;
    --font-body: -apple-system, "Segoe UI", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #211a13; --ink: #f3e7d8; --ink-soft: #cbb59c; --accent: #f0925f;
      --warn-bg: #3a2c18; --warn-ink: #f0a560;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
  }
  .wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: .9rem;
    text-align: center;
    max-width: 320px;
  }
  .spinner {
    width: 2rem;
    height: 2rem;
    border-radius: 50%;
    border: 3px solid var(--warn-bg);
    border-top-color: var(--accent);
    animation: spin .8s linear infinite;
  }
  .spinner.hide { display: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  p { margin: 0; font-size: .92rem; line-height: 1.6; color: var(--ink-soft); }
  p.warn { color: var(--warn-ink); }
</style>
</head>
<body>
<div class="wrap">
  <div class="spinner" id="spinner"></div>
  <p id="status">開啟中…</p>
</div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
(function () {
  // 「富來大郡跳轉」這支獨立的 LIFF app（2026-08-16 新增，Endpoint URL 指這一頁），
  // 跟 bot-form.html 用的 LIFF_ID（結尾 8KD6wVsP）是不同支，但同一個 channel（2011103776）
  // 底下——第一次建錯挑到別的 channel，token audience 對不上，backend 驗證會失敗
  // （見 verifyLiffIdToken 的說明），這支是重建過、確認同 channel 之後的正確版本
  var LIFF_ID = '2011103776-bKqxHWPg';
  var API_URL = 'https://community-line-bot.fulaidajuncommunity.workers.dev/api/liff-command';

  var spinnerEl = document.getElementById('spinner');
  var statusEl = document.getElementById('status');

  function showError(text) {
    spinnerEl.classList.add('hide');
    statusEl.textContent = text;
    statusEl.className = 'warn';
  }

  // 跟 bot-form.html 的 resolveQueryParams 同一套邏輯（見那邊的說明）：LIFF 從帶 query
  // string 的網址開啟時，會把整包參數包進 liff.state 再多包一層 URL encode
  function resolveQueryParams() {
    var direct = new URLSearchParams(location.search);
    var state = direct.get('liff.state');
    if (!state) return direct;
    if (state.charAt(0) === '?') state = state.slice(1);
    return new URLSearchParams(state);
  }

  var params = resolveQueryParams();
  // cmdPrefix 尾端可能殘留 liff.state 編碼造成的「+」字元（同 bot-form.html 的說明），
  // 這頁送出的是完整指令、不會再接使用者輸入，一樣先清掉尾端保險
  var cmd = (params.get('cmd') || '').replace(/[+\s]+$/, '');
  var groupId = params.get('groupId') || '';
  // url（2026-08-26 新增）：外部連結模式，見 community-line-bot 的 externalLinkButton 說明——
  // LINE 內建瀏覽器不支援 window.print()，社區官網規約頁面的「列印／另存 PDF」按鈕在裡面點了
  // 沒反應，這個模式讓 Flex 訊息裡的連結按鈕（清潔班表／開通教學）先繞來這裡，用官方的
  // liff.openWindow(..., external: true) 強制跳出去用系統瀏覽器。跟 cmd 模式互斥，呼叫端
  // 只會帶其中一個參數，不會同時出現
  var externalUrl = params.get('url') || '';
  // 這個 LIFF app 掛在 liff.line.me 這個 LINE 官方網域下，任何人都可以自己組
  // https://liff.line.me/2011103776-bKqxHWPg?url=<任意網址> 這種連結——如果不驗證
  // externalUrl 的來源，這一頁就變成一個「開放重導向」（open redirect）：有心人士可以
  // 拿 LINE 官方網域＋社區官方帳號的信任度，把人導去釣魚網站或其他惡意頁面。只放行我們
  // 自己 FulaiDajun 這個網域，其他一律擋下來，不呼叫 liff.openWindow
  var ALLOWED_EXTERNAL_ORIGIN = 'https://fulaidajuncommunity-dev.github.io';

  if (!window.liff) {
    showError('LIFF SDK 載入失敗，請確認網路連線後重新整理。');
    return;
  }

  if (externalUrl) {
    var externalOrigin = null;
    try { externalOrigin = new URL(externalUrl).origin; } catch (e) {}
    if (externalOrigin !== ALLOWED_EXTERNAL_ORIGIN) {
      showError('這個連結目標不合法，請從原本的按鈕重新點一次。');
      return;
    }
    // 純粹「開新分頁」的導覽動作，不用登入、不用打 /api/liff-command，比 cmd 那條路更輕量
    liff.init({ liffId: LIFF_ID }).then(function () {
      liff.openWindow({ url: externalUrl, external: true });
      // openWindow 只負責開新分頁，不會自動關掉這個 LIFF 分頁本身——跟 cmd 模式送出後呼叫
      // liff.closeWindow() 同一個道理，行動裝置上才會回到聊天室，不留一個空白分頁在後面
      if (liff.isInClient && liff.isInClient()) {
        liff.closeWindow();
      }
    }).catch(function (err) {
      console.error('liff.init failed (external mode)', err);
      // liff.init 失敗就退回最原始的行為：至少還能在 LINE 內建瀏覽器裡看到內容，
      // 只是列印按鈕依然會失效——比完全打不開網頁好
      location.href = externalUrl;
    });
    return;
  }

  if (!cmd) {
    showError('這個網址缺少必要參數，麻煩從圖文選單重新點一次。');
    return;
  }

  liff.init({ liffId: LIFF_ID }).then(function () {
    if (!liff.isLoggedIn()) {
      liff.login();
      return;
    }

    var idToken = liff.getIDToken && liff.getIDToken();
    if (!idToken) {
      showError('無法取得身份驗證資訊，請重新從圖文選單點一次。');
      return;
    }

    fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ idToken: idToken, text: cmd, groupId: groupId || undefined }),
    })
      .then(function (resp) { return resp.json().then(function (body) { return { ok: resp.ok, body: body }; }); })
      .then(function (result) {
        if (!result.ok || !result.body || !result.body.ok) {
          showError((result.body && result.body.error) || '開啟失敗，請稍後再試一次。');
          return;
        }
        if (liff.isInClient && liff.isInClient()) {
          liff.closeWindow();
        } else {
          // 桌面版 LINE 沒有內建 LIFF 瀏覽器，這個分頁是系統層級開的外部瀏覽器分頁，
          // window.close() 常被瀏覽器安全限制擋下來（同 bot-form.html 的說明），失敗的話
          // 就交給下面的文字提示，使用者自己手動關閉
          try { window.close(); } catch (e) {}
          spinnerEl.classList.add('hide');
          statusEl.textContent = '已送出，這個視窗可以關閉了。';
        }
      })
      .catch(function (err) {
        console.error('auto submit failed', err);
        showError('網路連線失敗，請確認網路後再試一次。');
      });
  }).catch(function (err) {
    console.error('liff.init failed', err);
    showError('無法連上 LINE 驗證身份，請確認是從 LINE App 裡開啟這個頁面。');
  });
})();
</script>
</body>
</html>
